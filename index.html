<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <h1>Rock, Paper Scissors!</h1>

    <ul>
      <li id="rock">
        <img src="img/rock.png" height="100px" alt="Rock Illustration" />
        <p>Rock!</p>
      </li>
      <li id="paper">
        <img src="img/paper.png" height="100px" alt="Paper Illustration" />
        <p>Paper!</p>
      </li>
      <li id="scissors">
        <img src="img/scissors.png" height="100px" alt="Scissors Illustration" />
        <p>Scissors!</p>
      </li>
    </ul>

    <ul>
      <li>You have 0 points</li>
      <li>Computer has 0 points</li>
    </ul>
    <p>__ won last round</p>
